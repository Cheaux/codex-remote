<g font-family="sans-serif" fill="#f5f7fa"><text x="294" y="126" font-size="24" font-weight="bold">PC → ChatGPT on your phone</text><text x="294" y="170" font-size="17">1. Generate a QR on your computer</text><text x="294" y="206" font-size="17">2. Scan it and finish setup in ChatGPT</text><text x="294" y="242" font-size="17">3. Check: codex-remote status</text><text x="294" y="292" font-size="15" fill="#c4cfdd">Same ChatGPT account and workspace</text><text x="24" y="354" font-size="16" font-weight="bold">Illustration only — this sample QR cannot pair a device.</text><text x="24" y="382" font-size="14" fill="#c4cfdd">Pairing keeps local sessions running. Access persists until you disable it.</text></g></svg>