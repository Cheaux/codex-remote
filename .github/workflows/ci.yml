name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/checkout@v7.0.1
        with:
          repository: Cheaux/codex-command-extensions
          ref: v0.1.2
          path: .terminal-host
      - run: npm ci --prefix .terminal-host
      - run: npm run build --prefix .terminal-host
      - run: npm run check
      - run: npm test
        env:
          CODEX_TERMINAL_TEST_ROOT: ${{ github.workspace }}/.terminal-host
      - run: npm run test:package
      - run: npm run package:directory
