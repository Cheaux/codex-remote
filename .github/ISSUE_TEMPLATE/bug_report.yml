name: Bug report
description: Report installation, pairing, or connection problems.
body:
  - type: markdown
    attributes:
      value: "Please leave out pairing codes, QR images, account details, and tokens."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected and the steps to reproduce it.
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions and environment
      description: Computer OS, Node version, Codex version, Codex Remote version, and phone OS.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message
      description: Paste the error text after removing private information.
